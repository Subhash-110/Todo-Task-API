server:
  port: 8080 #set port for your spring boot application

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    #URL for H2 database in memory mode
    driver-class-name: org.h2.Driver # The JDBC driver for H2
    username: sa
    password:
  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update #Automatically creates or updates the database schema based on entity classes.
    show-sql: true # Enables logging of SQL queries generated by JPA.